# PR guardian: lint, test, and the image-contract gate on every pull request
# and push to main. The image job builds the official image and runs
# `argus doctor --binaries` inside it (ADR 0013, ADR 0027) — it checks git and
# every scanner in the Manifest (Catalog entries with `Manifest: true`), so a
# PR that drops a Manifest scanner from the Dockerfile goes red here. The release pipeline reuses these
# build/cache patterns for its per-architecture publish.
#
# lint and test run their tools through mise, so CI uses the exact go and
# golangci-lint versions pinned in .mise.toml — no drift from local dev.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: golangci-lint
        run: make lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: go test -race
        run: make test
      # The scanner catalog pages are generated from the Tool Catalog
      # (ADR 0027). `make test` already fails on drift; this names the fix.
      - name: Scanner catalog pages are up to date
        run: make docs-check

  image-gate:
    name: image-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Single-arch for a fast PR loop; multi-arch is the release pipeline's
      # job. GHA layer cache keeps rebuilds cheap when only source changes.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: argus:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # No attestations on the PR gate: they belong to the release
          # pipeline, and a provenance manifest list can't be `--load`ed into
          # the runner's docker image store. Keep the build a single loadable
          # image so `docker run` below can execute it.
          provenance: false
      # The image contract: git and every Manifest scanner must be present.
      # Catalogued scanners outside the Manifest are the operator's to install
      # and are not checked. Exits non-zero if any is missing, failing the PR.
      - name: Image-contract gate (the Manifest) — argus doctor --binaries
        run: docker run --rm argus:ci doctor --binaries
      # The image runs as nonroot, uid 65532: the Kubernetes guide's
      # `fsGroup: 65532` and every image built on this one rely on it, so a
      # base-image change must not move it.
      - name: Image runs as uid 65532
        run: test "$(docker run --rm --entrypoint id argus:ci -u)" = 65532
